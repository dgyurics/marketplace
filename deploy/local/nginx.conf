# Upgrade websocket requests (Vite HMR). For ordinary requests, omit Connection
# so upstream keepalive works instead of closing the connection after each request.
map $http_upgrade $connection_upgrade {
   default upgrade;
   ''      '';
}

upstream api_backend {
   server host.docker.internal:8000;
   keepalive 32;
}

upstream web_backend {
   server host.docker.internal:5173;
   keepalive 64;
}

upstream imgproxy_backend {
   server imgproxy:80;
   keepalive 32;
}

server {
   listen 80;
   server_name marketplace;

   # Security headers
   add_header X-Content-Type-Options  "nosniff" always;
   add_header X-Frame-Options         "SAMEORIGIN" always;
   add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

   proxy_connect_timeout 5s;

   # Gzip
   gzip            on;
   gzip_vary       on;
   gzip_min_length 1024;
   gzip_comp_level 6;
   gzip_types      application/json text/plain;

   # API: users
   location ~ ^/api/users(/.*)?$ {
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;

      proxy_http_version                 1.1;
      proxy_set_header Connection        "";

      proxy_pass                         http://api_backend/users$1$is_args$args;
   }

   # API: orders
   location ~ ^/api/orders(/.*)?$ {
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;

      proxy_http_version                 1.1;
      proxy_set_header Connection        "";

      proxy_pass                         http://api_backend/orders$1$is_args$args;
   }

   # API: stripe webhooks
   location /api/payment/events {
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;

      proxy_http_version                 1.1;
      proxy_set_header Connection        "";

      proxy_pass                         http://api_backend/payment/events;
   }

   # API: image uploads (larger body)
   location /api/images/products/ {
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;

      proxy_http_version                 1.1;
      proxy_set_header Connection        "";

      proxy_pass                         http://api_backend/images/products/;
      client_max_body_size               30M;
   }

   # API: catch-all
   location /api/ {
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;

      proxy_http_version                 1.1;
      proxy_set_header Connection        "";

      proxy_pass                         http://api_backend/;
   }

   # Image proxy (imgproxy)
   location /images/ {
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;

      proxy_http_version                 1.1;
      proxy_set_header Connection        "";

      proxy_pass                         http://imgproxy_backend/;
   }

   # Frontend (Vite dev server)
   location / {
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;

      proxy_http_version                 1.1;

      proxy_pass                         http://web_backend;
   }
}
