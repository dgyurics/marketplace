server {
   listen 80;
   server_name marketplace;

   # Security headers
   add_header X-Content-Type-Options  "nosniff" always;
   add_header X-Frame-Options         "SAMEORIGIN" always;
   add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

   # Gzip
   gzip            on;
   gzip_vary       on;
   gzip_min_length 1024;
   gzip_comp_level 6;
   gzip_types      application/json text/plain;

   # API: users
   location ~ ^/api/users(/.*)?$ {
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;

      proxy_pass                         http://host.docker.internal:8000/users$1$is_args$args;
   }

   # API: orders
   location ~ ^/api/orders(/.*)?$ {
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;

      proxy_pass                         http://host.docker.internal:8000/orders$1$is_args$args;
   }

   # API: stripe webhooks
   location /api/payment/events {
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;

      proxy_pass                         http://host.docker.internal:8000/payment/events;
   }

   # API: image uploads (larger body)
   location /api/images/products/ {
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        "upgrade";

      proxy_pass                         http://host.docker.internal:8000/images/products/;
      client_max_body_size               30M;
   }

   # API: catch-all
   location /api/ {
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;

      proxy_pass                         http://host.docker.internal:8000/;
   }

   # Image proxy (imgproxy)
   location /images/ {
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;

      proxy_pass                         http://imgproxy/;
   }

   # Frontend (Vite dev server)
   location / {
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        "upgrade";

      proxy_pass                         http://host.docker.internal:5173/;
   }
}